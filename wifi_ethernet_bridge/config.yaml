name: "WiFi to Ethernet Bridge"
version: "2026.09.18.2"
slug: "wifi_ethernet_bridge"
description: "Share this device's WiFi connection out its Ethernet port (proxy ARP + DHCP relay), so a wired-only device plugged into it gets network access."
url: "https://github.com/drmogie/pi-wifi-ethernet-bridge-addon"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
host_network: true
full_access: true
privileged:
  - NET_ADMIN
  - NET_RAW
options:
  wlan_interface: wlan0
  eth_interface: eth0
  enable_avahi_reflector: false
schema:
  wlan_interface: str
  eth_interface: str
  enable_avahi_reflector: bool
